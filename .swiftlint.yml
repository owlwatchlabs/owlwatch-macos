disabled_rules:
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - sorted_imports

analyzer_rules:
  - unused_declaration
  - unused_import

included:
  - apps
  - extensions
  - packages
  - tools

excluded:
  - .build
  - DerivedData

line_length:
  warning: 120
  error: 140

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - db

reporter: xcode

