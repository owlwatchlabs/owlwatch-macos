# Required status checks: `build`, `test`. Spec: docs/repo-config.md
name: Build & test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Detect Swift package
        id: detect
        shell: bash
        run: |
          if [ -f "packages/Package.swift" ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No packages/Package.swift; skipping swift build."
          fi

      - name: Toolchain version
        if: steps.detect.outputs.has_package == 'true'
        run: swift --version

      - name: swift build (packages)
        if: steps.detect.outputs.has_package == 'true'
        run: swift build --package-path packages --build-tests -c debug

      - name: Build macOS app (Nightwatch)
        if: hashFiles('apps/Nightwatch/Nightwatch.xcodeproj/project.pbxproj') != ''
        run: |
          set -o pipefail
          xcodebuild build \
            -project apps/Nightwatch/Nightwatch.xcodeproj \
            -scheme Nightwatch \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build iOS app (NightwatchMobile)
        if: hashFiles('apps/NightwatchMobile/NightwatchMobile.xcodeproj/project.pbxproj') != ''
        run: |
          set -o pipefail
          xcodebuild build \
            -project apps/NightwatchMobile/NightwatchMobile.xcodeproj \
            -scheme NightwatchMobile \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  test:
    name: test
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Detect Swift package
        id: detect
        shell: bash
        run: |
          if [ -f "packages/Package.swift" ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No packages/Package.swift; skipping swift test."
          fi

      - name: swift test (packages)
        if: steps.detect.outputs.has_package == 'true'
        run: swift test --package-path packages --parallel
