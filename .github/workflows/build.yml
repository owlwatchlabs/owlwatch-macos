# Required status checks: `build`, `test`. Spec: docs/repo-config.md
#
# Path-filter strategy: the workflow always runs (so its required-check
# status reports green on every PR, including docs-only ones), but the
# expensive build/test steps gate on a `dorny/paths-filter@v3` detection
# of whether any Swift-relevant file changed. Docs-only PRs run the runner
# allocation + filter step (~30s on macOS) and skip the rest.
name: Build & test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Detect Swift-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - '**/*.swift'
              - 'packages/Package.swift'
              - 'packages/Package.resolved'
              - 'apps/*/project.yml'
              - 'apps/*/Sources/*.plist'
              - 'apps/*/Sources/*.entitlements'
              - 'apps/*/*.xcodeproj/**'
              - '.github/workflows/build.yml'

      - name: Detect Swift package
        id: detect
        shell: bash
        run: |
          if [ -f "packages/Package.swift" ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No packages/Package.swift; skipping swift build."
          fi

      - name: Skip notice (no Swift changes)
        if: steps.filter.outputs.swift != 'true'
        run: echo "::notice::No Swift / Package.swift / project.yml / xcodeproj / build.yml changes detected. Build steps skipped."

      - name: Cache SwiftPM build artifacts
        if: steps.detect.outputs.has_package == 'true' && steps.filter.outputs.swift == 'true'
        uses: actions/cache@v4
        with:
          path: |
            packages/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('packages/Package.swift', 'packages/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Toolchain version
        if: steps.detect.outputs.has_package == 'true' && steps.filter.outputs.swift == 'true'
        run: swift --version

      - name: swift build (packages)
        if: steps.detect.outputs.has_package == 'true' && steps.filter.outputs.swift == 'true'
        run: swift build --package-path packages --build-tests -c debug

      - name: Build macOS app (Owlwatch)
        if: steps.filter.outputs.swift == 'true' && hashFiles('apps/Owlwatch/Owlwatch.xcodeproj/project.pbxproj') != ''
        run: |
          set -o pipefail
          xcodebuild build \
            -project apps/Owlwatch/Owlwatch.xcodeproj \
            -scheme Owlwatch \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build iOS app (OwlwatchMobile)
        if: steps.filter.outputs.swift == 'true' && hashFiles('apps/OwlwatchMobile/OwlwatchMobile.xcodeproj/project.pbxproj') != ''
        run: |
          set -o pipefail
          xcodebuild build \
            -project apps/OwlwatchMobile/OwlwatchMobile.xcodeproj \
            -scheme OwlwatchMobile \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  test:
    name: test
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Detect Swift-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - '**/*.swift'
              - 'packages/Package.swift'
              - 'packages/Package.resolved'
              - 'apps/*/project.yml'
              - 'apps/*/Sources/*.plist'
              - 'apps/*/Sources/*.entitlements'
              - 'apps/*/*.xcodeproj/**'
              - '.github/workflows/build.yml'

      - name: Detect Swift package
        id: detect
        shell: bash
        run: |
          if [ -f "packages/Package.swift" ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No packages/Package.swift; skipping swift test."
          fi

      - name: Skip notice (no Swift changes)
        if: steps.filter.outputs.swift != 'true'
        run: echo "::notice::No Swift / Package.swift / project.yml / xcodeproj / build.yml changes detected. Test step skipped."

      - name: Cache SwiftPM build artifacts
        if: steps.detect.outputs.has_package == 'true' && steps.filter.outputs.swift == 'true'
        uses: actions/cache@v4
        with:
          path: |
            packages/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('packages/Package.swift', 'packages/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: swift test (packages)
        if: steps.detect.outputs.has_package == 'true' && steps.filter.outputs.swift == 'true'
        run: swift test --package-path packages --parallel
