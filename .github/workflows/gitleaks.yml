# Required status check: `gitleaks`. Spec: docs/repo-config.md
# Until GHAS Secret Scanning is enabled (post-public, see docs/repo-config.md
# "Private repo posture"), this workflow is the only secret scanner. Failure
# is stop-the-line: never bypass.
name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
