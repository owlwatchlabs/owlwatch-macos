# Required status check: `codeql`. Spec: docs/repo-config.md
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Detect Swift package
        id: detect
        shell: bash
        run: |
          if [ -f "packages/Package.swift" ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No packages/Package.swift; skipping CodeQL analysis."
          fi

      - name: Initialize CodeQL
        if: steps.detect.outputs.has_package == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          queries: security-extended

      - name: Manual build for CodeQL
        if: steps.detect.outputs.has_package == 'true'
        run: swift build --package-path packages -c debug

      - name: Analyze
        if: steps.detect.outputs.has_package == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
