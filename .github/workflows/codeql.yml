# Required status check: `codeql`. Spec: docs/repo-config.md
#
# Path-filter strategy: the workflow always runs on pull_request and
# push-to-main (so its required-check status reports green on every PR),
# but the CodeQL init/build/analyze steps gate on a `dorny/paths-filter@v3`
# detection of whether any Swift-relevant file changed. Docs-only PRs skip
# the multi-minute CodeQL phase.
#
# The weekly cron schedule (Mondays 06:00 UTC) bypasses the filter — there
# is no PR diff to compare against — and always runs the full analysis
# against main with the broader security-extended query suite.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Detect Swift-relevant changes
        id: filter
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - '**/*.swift'
              - 'packages/Package.swift'
              - 'packages/Package.resolved'
              - 'apps/*/project.yml'
              - 'apps/*/Sources/*.plist'
              - 'apps/*/Sources/*.entitlements'
              - 'apps/*/*.xcodeproj/**'
              - '.github/workflows/codeql.yml'

      - name: Detect Swift package
        id: detect
        shell: bash
        run: |
          if [ -f "packages/Package.swift" ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No packages/Package.swift; skipping CodeQL analysis."
          fi

      - name: Skip notice (no Swift changes, non-schedule event)
        if: github.event_name != 'schedule' && steps.filter.outputs.swift != 'true'
        run: echo "::notice::No Swift / Package.swift / project.yml / xcodeproj / codeql.yml changes detected. CodeQL analysis skipped."

      - name: Cache SwiftPM build artifacts
        if: steps.detect.outputs.has_package == 'true' && (github.event_name == 'schedule' || steps.filter.outputs.swift == 'true')
        uses: actions/cache@v4
        with:
          path: |
            packages/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('packages/Package.swift', 'packages/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Initialize CodeQL
        if: steps.detect.outputs.has_package == 'true' && (github.event_name == 'schedule' || steps.filter.outputs.swift == 'true')
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          # Default to security-and-quality on PRs (fast feedback). Use the
          # broader security-extended suite only on the weekly cron run
          # against main, where slower-but-deeper analysis is worth the
          # runner minutes. security-extended adds ~40-60% to analyze time
          # for mostly stylistic / low-severity additions; the high-signal
          # security checks live in security-and-quality.
          queries: ${{ github.event_name == 'schedule' && 'security-extended' || 'security-and-quality' }}

      - name: Manual build for CodeQL
        if: steps.detect.outputs.has_package == 'true' && (github.event_name == 'schedule' || steps.filter.outputs.swift == 'true')
        run: swift build --package-path packages -c debug

      - name: Analyze
        if: steps.detect.outputs.has_package == 'true' && (github.event_name == 'schedule' || steps.filter.outputs.swift == 'true')
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
          # SARIF upload requires GitHub Advanced Security, which is paid on
          # private repos. owlwatch defers GHAS until it flips public at or
          # before M15 (see docs/repo-config.md "Private repo posture"). Run
          # the queries locally so the job still gates on findings; skip the
          # upload until Code Scanning is enabled in repo settings.
          upload: never
