id: T1059.004-process-from-tmp
name: Process executing from /tmp or /var/tmp
description: |
  Processes whose executable lives under /tmp or /var/tmp are
  effectively never legitimate — these directories are world-writable
  and the system never installs persistent binaries there. A running
  process executing from /tmp is almost always either an attacker's
  payload, an outdated installer artifact, or a build-system
  intermediate that escaped its sandbox.

  Excludes /tmp/com.apple.* (Apple's own short-lived inter-process
  helpers can transit /tmp legitimately).
mitre: T1059.004
severity: high
when:
  source: process
  match:
    path:
      matches: '^(/tmp/|/var/tmp/|/private/tmp/|/private/var/tmp/)(?!com\.apple\.)'
evidence:
  - pid
  - name
  - path
  - user_id
