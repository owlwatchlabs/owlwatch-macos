name: Owlwatch

options:
  bundleIdPrefix: com.owlwatchlabs.owlwatch
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    # M7 signing posture. Apple Developer Program team
    # 8VA5VUL6X6 (OwlWatch Labs). See memory/signing-posture.md.
    #
    # CODE_SIGN_STYLE = Automatic so xcodebuild fetches/generates
    # the matching provisioning profile (carries the System
    # Extension + Network Extension capabilities). This needs:
    #
    #   1. The team's Apple ID logged in via Xcode → Settings →
    #      Accounts (one-time, persists across xcodebuild runs).
    #   2. `xcodebuild -allowProvisioningUpdates ...` so the build
    #      is allowed to fetch profiles.
    #   3. SIP disabled + `systemextensionsctl developer on` on
    #      the dev machine so the resulting sysext actually loads.
    #
    # The release pipeline (M15+) switches to manual Developer ID
    # signing for notarization — separate xcconfig, not here.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "8VA5VUL6X6"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Owlwatch:
    path: ../../packages

targets:
  Owlwatch:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      # Bundle the shipped OWRules YAML library as a Resources/Rules/
      # subdirectory in the app. The faceted process list runs the
      # rules engine on-the-fly to populate per-row rule counts and
      # the "Flagged" facet.
      - path: ../../packages/Rules
        buildPhase: resources
        name: Rules
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Owlwatch contributors."
        # Auto-register bundled fonts at launch. The directory is
        # relative to the bundle's Resources root, so "Fonts" picks
        # up apps/Owlwatch/Resources/Fonts/.
        ATSApplicationFontsPath: "Fonts/"
        # Shown to the user in the system-extension approval prompt
        # when the app calls OSSystemExtensionRequest. macOS will
        # display this in the "Security & Privacy" sheet that
        # surfaces during the first M7 activation.
        NSSystemExtensionUsageDescription: "Owlwatch installs a content filter system extension so it can show every network connection the system makes, with process attribution. The filter only observes — it does not block."
    # Container-app entitlements. Declared inline here because
    # xcodegen overwrites the `path:` file at generate time — if
    # the keys live only in the .entitlements XML they get wiped
    # the moment someone re-runs xcodegen.
    #
    # - system-extension.install: required to call
    #   OSSystemExtensionRequest. M7+ uses this to install the
    #   OwlwatchContentFilter sysext.
    # - application-groups: shared namespace with the sysext. M7.2
    #   will use it to name the XPC mach-service.
    #
    # Sandbox stays off (no sandbox key) — an EDR can't operate
    # inside the app sandbox, see Sources/Owlwatch.entitlements
    # header comment.
    entitlements:
      path: Sources/Owlwatch.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups:
          - group.com.owlwatchlabs.owlwatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owlwatchlabs.owlwatch
        PRODUCT_NAME: Owlwatch
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Owlwatch
        product: OWCore
      - package: Owlwatch
        product: OWPersistence
      - package: Owlwatch
        product: OWDevices
      - package: Owlwatch
        product: OWProcess
      - package: Owlwatch
        product: OWNetwork
      - package: Owlwatch
        product: OWLog
      - package: Owlwatch
        product: OWBinary
      - package: Owlwatch
        product: OWCodeSigning
      - package: Owlwatch
        product: OWRules
      - package: Owlwatch
        product: OWTriage
      # M7.2 shared module — FlowEvent model + XPC protocols +
      # client wrapper. The container app uses FlowEventClient to
      # consume the live flow stream from the sysext.
      - package: Owlwatch
        product: OWNetworkExt
      # M7 — content-filter system extension. xcodegen's
      # `embed: true` on a system-extension target installs it
      # under Contents/Library/SystemExtensions/ in the app bundle
      # (the macOS-canonical path the system-extensions daemon
      # looks at during activation).
      - target: OwlwatchContentFilter
        embed: true
        codeSign: true

  # M7 Content Filter system extension. NEFilterDataProvider-backed,
  # delivered as a macOS system extension. Activation is requested
  # by the container app via OSSystemExtensionRequest; configuration
  # is handed off through NEFilterManager.
  OwlwatchContentFilter:
    type: system-extension
    platform: macOS
    sources:
      - path: OwlwatchContentFilter/Sources
    dependencies:
      # FlowEvent model + XPC listener wrapper. The extension
      # uses FlowEventListener to advertise itself on the Mach
      # service the container app dials.
      - package: Owlwatch
        product: OWNetworkExt
      # `audit_token_to_pid` (libbsm) is required by FlowExtraction
      # for resolving the source process of each NEFilterFlow.
      # `proc_pidpath_audittoken` (libproc) is part of the system
      # framework already; libbsm must be linked explicitly.
      - sdk: libbsm.tbd
    info:
      path: OwlwatchContentFilter/Info.plist
      properties:
        CFBundleDisplayName: Owlwatch Content Filter
        LSMinimumSystemVersion: "15.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Owlwatch contributors."
        # NSExtension dict is the canonical discovery key the
        # SystemExtensions framework reads when scanning the
        # parent app's Contents/Library/SystemExtensions/. The
        # Xcode 26 build system warning ("Foundation extension
        # must be in PlugIns") fires alongside but is a separate,
        # cosmetic complaint — empirically the framework requires
        # NSExtension to find the bundle.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.filter-data
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentFilterProvider
        # NEProviderClasses is the legacy NE dict; included for
        # belt-and-suspenders in case NEProvider's runtime lookup
        # falls through NSExtension on macOS 15.
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).ContentFilterProvider
    # Sysext entitlements. Same xcodegen-overwrite caveat as the
    # container app — keys live in `properties:`, the .entitlements
    # XML is a generated artifact.
    #
    # `content-filter-provider` (bare, no `-systemextension`
    # suffix) is what Apple's auto-generated Development
    # provisioning profile authorizes. The Distribution
    # (Developer ID + notarization) path uses the `-systemextension`
    # suffix variant — when we add the release xcconfig (M15) it
    # will override this entitlement value.
    entitlements:
      path: OwlwatchContentFilter/OwlwatchContentFilter.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - content-filter-provider
        com.apple.security.application-groups:
          - group.com.owlwatchlabs.owlwatch
        # Explicitly disable get-task-allow — Debug builds auto-
        # inject `true` (lets Xcode attach a debugger), but macOS
        # rejects sysexts with this flag set even on dev-signed
        # builds, and the rejection surfaces as the catch-all
        # "Extension not found" error from OSSystemExtensionRequest.
        com.apple.security.get-task-allow: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owlwatchlabs.owlwatch.contentfilter
        PRODUCT_NAME: OwlwatchContentFilter
        # Force the module name to match the bundle's exec — used
        # by the NSExtensionPrincipalClass key above.
        PRODUCT_MODULE_NAME: OwlwatchContentFilter
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
