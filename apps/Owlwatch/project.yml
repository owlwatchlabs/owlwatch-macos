name: Owlwatch

options:
  bundleIdPrefix: com.owlwatchlabs.owlwatch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Owlwatch:
    path: ../../packages

targets:
  Owlwatch:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Owlwatch contributors."
        # Auto-register bundled fonts at launch. The directory is
        # relative to the bundle's Resources root, so "Fonts" picks
        # up apps/Owlwatch/Resources/Fonts/.
        ATSApplicationFontsPath: "Fonts/"
    # Entitlements are sourced verbatim from the file; project.yml is no
    # longer responsible for setting them. The intentional configuration
    # (no sandbox, no extra entitlements) is documented in the .entitlements
    # XML.
    entitlements:
      path: Sources/Owlwatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owlwatchlabs.owlwatch
        PRODUCT_NAME: Owlwatch
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Owlwatch
        product: OWCore
      - package: Owlwatch
        product: OWPersistence
      - package: Owlwatch
        product: OWDevices
      - package: Owlwatch
        product: OWProcess
      - package: Owlwatch
        product: OWNetwork
      - package: Owlwatch
        product: OWLog
      - package: Owlwatch
        product: OWBinary
      - package: Owlwatch
        product: OWCodeSigning
